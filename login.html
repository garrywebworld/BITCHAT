<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — BITCHAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>
  <div id="toast-stack"></div>

  <main class="auth-screen">
    <div class="auth-card">
      <div class="brand-mark">
        <div class="glyph">B</div>
        <span>BITCHAT</span>
      </div>

      <h1>Welcome back</h1>
      <p class="sub">Log in to continue your conversations.</p>

      <div id="form-error" class="form-error hidden"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div class="forgot-row">
          <button type="button" id="forgot-btn">Forgot password?</button>
        </div>
        <button type="submit" class="btn-primary" id="login-btn">
          <span class="btn-label">Log in</span>
        </button>
      </form>

      <div class="divider-row">or</div>

      <button type="button" class="btn-google" id="google-btn">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.5 18.9 12.7 24 12.7c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.3 35.4 26.8 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.2 5.2C40.9 36.1 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        <span>Continue with Google</span>
      </button>

      <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    </div>
  </main>

  <script type="module">
    import { redirectIfAuthenticated, loginUser, loginWithGoogle, resetPassword, friendlyAuthError } from "./js/auth.js";
    import { $, showToast, setPageLoading, setButtonLoading, showFormError, clearFormError } from "./js/ui.js";

    // If already logged in, this immediately redirects to chat.html.
    redirectIfAuthenticated(() => setPageLoading(false));

    const form = $("login-form");
    const errorBox = $("form-error");
    const loginBtn = $("login-btn");
    const googleBtn = $("google-btn");
    const forgotBtn = $("forgot-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearFormError(errorBox);

      const email = $("email").value.trim();
      const password = $("password").value;

      setButtonLoading(loginBtn, true, "Logging in...", "Log in");
      try {
        await loginUser({ email, password });
        showToast("Logged in successfully.");
        window.location.href = "chat.html";
      } catch (err) {
        console.error("[login.html] Login failed:", err);
        showFormError(errorBox, friendlyAuthError(err));
      } finally {
        setButtonLoading(loginBtn, false, "Logging in...", "Log in");
      }
    });

    googleBtn.addEventListener("click", async () => {
      clearFormError(errorBox);
      setButtonLoading(googleBtn, true, "Connecting to Google...", "Continue with Google");
      try {
        await loginWithGoogle();
        showToast("Logged in with Google.");
        window.location.href = "chat.html";
      } catch (err) {
        console.error("[login.html] Google sign-in failed:", err);
        showFormError(errorBox, friendlyAuthError(err));
      } finally {
        setButtonLoading(googleBtn, false, "Connecting to Google...", "Continue with Google");
      }
    });

    forgotBtn.addEventListener("click", async () => {
      clearFormError(errorBox);
      const email = $("email").value.trim();
      if (!email) {
        showFormError(errorBox, "Enter your email address above first, then click 'Forgot password?' again.");
        return;
      }
      try {
        await resetPassword(email);
        showToast(`Password reset email sent to ${email}.`);
      } catch (err) {
        console.error("[login.html] Password reset failed:", err);
        showFormError(errorBox, friendlyAuthError(err));
      }
    });
  </script>
</body>
</html>
