<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>BITCHAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>
  <div id="toast-stack"></div>

  <div id="app-shell">
    <!-- ======================= Sidebar ======================= -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="glyph">B</div>
          <span>BITCHAT</span>
        </div>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="search-input" type="text" placeholder="Search people or chats..." autocomplete="off" />
      </div>

      <div id="user-results"></div>

      <div class="section-label">Conversations</div>
      <div id="conversation-list">
        <div class="empty-hint">No conversations yet.<br />Search for someone above to start chatting.</div>
      </div>

      <div class="sidebar-footer">
        <div class="avatar sm" id="me-avatar"></div>
        <div class="me-info">
          <div class="me-name" id="me-name">—</div>
          <div class="me-status">● Online</div>
        </div>
        <button class="icon-btn" id="logout-btn" title="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </aside>

    <!-- ======================= Chat panel ======================= -->
    <section id="chat-panel">
      <div id="chat-placeholder">
        <div class="glyph-lg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div>
          <h3>Your messages</h3>
          <p style="font-size: 13px; margin-top: 6px;">Select a conversation or search for someone to start chatting.</p>
        </div>
      </div>

      <div id="chat-active" class="hidden">
        <div class="chat-header">
          <button class="icon-btn" id="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <div class="avatar" id="chat-header-avatar"></div>
          <div class="chat-header-info">
            <div class="chat-header-name" id="chat-header-name">—</div>
            <div class="chat-header-status" id="chat-header-status">Offline</div>
          </div>
        </div>

        <div id="messages"></div>

        <div class="composer">
          <div class="composer-input-wrap">
            <textarea id="message-input" rows="1" placeholder="Type a message..."></textarea>
          </div>
          <button class="send-btn" id="send-btn" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
